<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><h1>Moderator</h1><div id="login" class="card"><form id="lf"><input id="email" type="email" required placeholder="Moderator email"><br><br><input id="pw" type="password" required placeholder="Password"><br><br><button class="primary">Sign in</button><div id="ls" class="status"></div></form></div><section id="panel" hidden><div class="row"><h2 style="flex:1">Moderation</h2><button id="out">Sign out</button></div><h2 class="section-title">Pending</h2><div id="pendingList"></div><h2 class="section-title">Approved</h2><div id="approvedList"></div></section></main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore,collection,addDoc,serverTimestamp,query,where,orderBy,onSnapshot,doc,updateDoc,setDoc,deleteDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { firebaseConfig } from "./config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const esc=(s="")=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let uq,uv,questions=[],votes=[];
function render(){let c={};votes.forEach(v=>c[v.questionId]=(c[v.questionId]||0)+1);let pending=questions.filter(x=>x.status==="pending"),approved=questions.filter(x=>x.status==="approved").sort((a,b)=>(a.answered===b.answered?((c[b.id]||0)-(c[a.id]||0)):(a.answered?1:-1)));
pendingList.innerHTML=pending.map(x=>`<div class="card" data-id="${x.id}"><div class="question">${esc(x.text)}</div><div class="row"><button class="approve" data-action="approve">Approve</button><button class="reject" data-action="reject">Reject</button><button class="danger" data-action="delete">Delete</button></div></div>`).join("")||'<p class="muted">Nothing waiting.</p>';
approvedList.innerHTML=approved.map(x=>`<div class="card ${x.answered?'answered':''}" data-id="${x.id}"><div class="question">${esc(x.text)}</div><p class="muted">👍 ${c[x.id]||0} ${x.answered?' · ✓ Answered':''}</p><div class="row"><button data-action="answered">${x.answered?'Mark unanswered':'Mark answered'}</button><button class="danger" data-action="delete">Delete</button></div></div>`).join("")||'<p class="muted">No approved questions.</p>';}
function watch(){uq=onSnapshot(collection(db,"questions"),s=>{questions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));render();},console.error);uv=onSnapshot(collection(db,"votes"),s=>{votes=s.docs.map(d=>d.data());render();},console.error);}
lf.onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,pw.value);ls.textContent="";}catch(x){ls.textContent=x.message;}};out.onclick=()=>signOut(auth);
panel.onclick=async e=>{let b=e.target.closest("[data-action]");if(!b)return;let card=b.closest("[data-id]"),id=card.dataset.id,q=questions.find(x=>x.id===id);if(b.dataset.action==="approve")await updateDoc(doc(db,"questions",id),{status:"approved"});if(b.dataset.action==="reject")await updateDoc(doc(db,"questions",id),{status:"rejected"});if(b.dataset.action==="answered")await updateDoc(doc(db,"questions",id),{answered:!q.answered});if(b.dataset.action==="delete"&&confirm("Delete this question permanently?"))await deleteDoc(doc(db,"questions",id));};
onAuthStateChanged(auth,u=>{login.hidden=!!u;panel.hidden=!u;if(u)watch();else{if(uq)uq();if(uv)uv();}});
</script></body></html>
