<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q&A Admin</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><h1>Moderator</h1><div id="login" class="card"><p>Sign in with the moderator account you created in Supabase Auth.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Email" required><br><br><input id="password" type="password" placeholder="Password" required><br><br>
<button class="primary">Sign in</button><div id="loginStatus" class="status"></div></form></div>
<section id="panel" hidden><div class="row"><h2 style="flex:1">Pending questions</h2><button id="logout">Sign out</button></div><div id="pending"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const db=window.qna.db, login=document.querySelector("#login"), panel=document.querySelector("#panel"), pending=document.querySelector("#pending");
function item(r){return `<div class="card" data-id="${r.id}"><div class="question">${window.qna.escapeHtml(r.text)}</div><br><div class="row"><button class="approve" data-action="approved">Approve</button><button class="reject" data-action="rejected">Reject</button></div></div>`}
async function load(){const {data,error}=await db.from("questions").select("id,text,created_at").eq("status","pending").order("created_at",{ascending:true});if(!error)pending.innerHTML=data.map(item).join("")||'<p class="muted">Nothing waiting.</p>'}
async function authUI(){const {data:{session}}=await db.auth.getSession();login.hidden=!!session;panel.hidden=!session;if(session)load()}
document.querySelector("#loginForm").onsubmit=async(e)=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});loginStatus.textContent=error?error.message:"";authUI()}
document.querySelector("#logout").onclick=async()=>{await db.auth.signOut();authUI()}
pending.onclick=async(e)=>{const b=e.target.closest("button[data-action]");if(!b)return;const id=b.closest("[data-id]").dataset.id;await db.from("questions").update({status:b.dataset.action}).eq("id",id);load()}
db.auth.onAuthStateChange(()=>authUI());
db.channel("admin-qna").on("postgres_changes",{event:"INSERT",schema:"public",table:"questions"},load).subscribe();
authUI();
</script></body></html>
