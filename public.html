<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Q&A</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap public"><h1>Live Q&A</h1><div id="list"></div></main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore,collection,addDoc,serverTimestamp,query,where,orderBy,onSnapshot,doc,updateDoc,setDoc,deleteDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { firebaseConfig } from "./config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const esc=(s="")=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let qs=[],vs=[];function render(){let c={};vs.forEach(v=>c[v.questionId]=(c[v.questionId]||0)+1);let a=[...qs].sort((x,y)=>(c[y.id]||0)-(c[x.id]||0));list.innerHTML=a.map(x=>`<div class="card question">${esc(x.text)}<p class="muted">👍 ${c[x.id]||0}</p></div>`).join("")||'<p class="muted">No approved questions yet.</p>';}
onSnapshot(query(collection(db,"questions"),where("status","==","approved")),s=>{qs=s.docs.map(d=>({id:d.id,...d.data()}));render();},console.error);onSnapshot(collection(db,"votes"),s=>{vs=s.docs.map(d=>d.data());render();},console.error);
</script></body></html>
