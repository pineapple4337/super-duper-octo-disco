<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Q&A</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap public"><h1>Live Q&A</h1><p class="muted">Approved questions</p><div id="questions"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const box=document.querySelector("#questions");
function card(r){return `<div class="card question">${window.qna.escapeHtml(r.text)}</div>`}
async function load(){const {data,error}=await window.qna.db.from("questions").select("id,text,created_at").eq("status","approved").order("created_at",{ascending:true});if(!error)box.innerHTML=data.map(card).join("")||'<p class="muted">No approved questions yet.</p>'}
load();
window.qna.db.channel("public-qna").on("postgres_changes",{event:"*",schema:"public",table:"questions"},load).subscribe();
</script></body></html>
