<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask a Question</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><h1>Live Q&A</h1><p class="muted">Ask your question below. It will be reviewed before appearing publicly.</p>
<div class="card"><form id="form"><textarea id="question" maxlength="300" required placeholder="Type your question…"></textarea>
<p class="muted"><span id="count">0</span>/300</p><button class="primary">Submit question</button><div class="status" id="status"></div></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const f=document.querySelector("#form"), q=document.querySelector("#question"), s=document.querySelector("#status"), c=document.querySelector("#count");
q.oninput=()=>c.textContent=q.value.length;
f.onsubmit=async(e)=>{e.preventDefault();const text=q.value.trim();if(!text)return;
s.textContent="Submitting…"; const {error}=await window.qna.db.from("questions").insert({text});
if(error){s.textContent="Could not submit. Please try again.";console.error(error);return}
q.value="";c.textContent="0";s.textContent="Submitted — thank you!";};
</script></body></html>
